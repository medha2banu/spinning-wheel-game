<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin & Win India</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#111;
color:white;
margin:0;
padding:0;
}

header{
padding:20px;
}

.logo{
width:120px;
}

h1{
color:#ffcc00;
}

.container{
margin-top:20px;
}

#wheel{
width:260px;
height:260px;
border-radius:50%;
border:10px solid #fff;
margin:auto;
background:conic-gradient(
#ff5722 0deg 60deg,
#4caf50 60deg 120deg,
#2196f3 120deg 180deg,
#ffeb3b 180deg 240deg,
#9c27b0 240deg 300deg,
#00bcd4 300deg 360deg
);
transition:transform 4s ease-out;
}

.pointer{
font-size:30px;
}

button{
padding:12px 25px;
font-size:18px;
background:#ff9800;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#ff5722;
}

.coins{
font-size:20px;
margin-top:10px;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:#222;
padding:30px;
border-radius:10px;
}

.menu{
margin-top:25px;
}

.menu button{
margin:5px;
}

</style>
</head>

<body>

<header>

<img src="swilogo.png" class="logo">

<h1>Spin & Win India 🇮🇳</h1>

<p>Play Games • Win Rewards • Daily Bonus</p>

</header>

<div class="coins">
Coins: <span id="coins">100</span>
</div>

<div class="container">

<div class="pointer">🔻</div>

<div id="wheel"></div>

<button onclick="spin()">SPIN (10 Coins)</button>

</div>

<div class="menu">

<button onclick="dailyBonus()">🎁 Daily Bonus</button>

<button onclick="alert('Scratch Card coming soon')">🎫 Scratch Card</button>

<button onclick="alert('Lucky Number coming soon')">🔢 Lucky Number</button>

</div>

<audio id="spinSound" src="spin_sound.mp3"></audio>

<div class="popup" id="popup">
<div class="popup-content">

<h2 id="resultText"></h2>

<button onclick="closePopup()">OK</button>

</div>
</div>

<script>

let wheel=document.getElementById("wheel");
let coins=parseInt(localStorage.getItem("coins")) || 100;
document.getElementById("coins").innerText=coins;

let rewards=[5,0,0,10,0,0,20,0,15,0,0,0,50];

function spin(){

if(coins<10){

alert("Not enough coins!");

return;

}

coins-=10;
updateCoins();

let sound=document.getElementById("spinSound");
sound.play();

let rand=Math.floor(Math.random()*rewards.length);
let deg=rand*60+720;

wheel.style.transform="rotate("+deg+"deg)";

setTimeout(()=>{

let reward=rewards[rand];

coins+=reward;

updateCoins();

showPopup("🎉 You won "+reward+" coins!");

},4000);

}

function updateCoins(){

document.getElementById("coins").innerText=coins;

localStorage.setItem("coins",coins);

}

function showPopup(text){

document.getElementById("resultText").innerText=text;

document.getElementById("popup").style.display="flex";

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

function dailyBonus(){

let today=new Date().toDateString();

let last=localStorage.getItem("daily");

if(last==today){

alert("Today's bonus already claimed!");

return;

}

coins+=20;

updateCoins();

localStorage.setItem("daily",today);

alert("🎁 Daily Bonus: 20 coins");

}

</script>

</body>
</html>
